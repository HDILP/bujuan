name: Build Flutter Android (New UI)

on:
  push:
    branches:
      - feature/new-ui
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码（包含子模块）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: feature/new-ui
          submodules: 'recursive' # 关键点：递归拉取所有子模块
          fetch-depth: 0          # 建议设置为0，拉取完整历史，避免某些插件依赖版本记录

      # 2. 设置 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. 获取依赖
      - name: Install dependencies
        run: flutter pub get

      # 5. 编译 APK
      - name: Build APK
        run: flutter build apk --debug

      # 6. 上传产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-new-ui-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
