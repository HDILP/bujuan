name: Build Flutter Android (New UI)

on:
  push:
    branches:
      - feature/new-ui
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main code
        uses: actions/checkout@v4
        with:
          ref: feature/new-ui

      - name: Clone sub-repo manually
        run: |
          mkdir -p plugin
          rm -rf plugin/bujuan_music_api
          git clone https://github.com/2697a/bujuan_music_api plugin/bujuan_music_api

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # 如果编译报错提示版本太新/太旧，可以改为 '3.22.0' 等具体版本
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 修正：去掉了不支持的 --stacktrace 参数
      # 如果想看详细日志，可以改为 flutter build apk --debug -v
      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-new-ui-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
