name: Build Flutter Android (New UI)

on:
  push:
    branches:
      - feature/new-ui
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出主仓库代码 (不带子模块，避免报错)
      - name: Checkout main code
        uses: actions/checkout@v4
        with:
          ref: feature/new-ui

      # 2. 手动克隆缺失的子模块
      # 我们直接将 API 仓库克隆到报错提示的那个路径
      - name: Clone sub-repo manually
        run: |
          rm -rf plugin/bujuan_music_api
          git clone https://github.com/2697a/bujuan_music_api plugin/bujuan_music_api

      # 3. 设置 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. 获取依赖
      - name: Install dependencies
        run: flutter pub get

      # 6. 编译 APK
      - name: Build APK
        run: flutter build apk --debug --stacktrace

      # 7. 上传产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-new-ui-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
