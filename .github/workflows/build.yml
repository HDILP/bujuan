name: Build Flutter Android (New UI)

on:
  push:
    branches:
      - feature/new-ui
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: feature/new-ui

      # 2. 设置 Java 环境 (Flutter 编译安卓需要)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 设置 Flutter 环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 如果 pubspec.yaml 里限制了版本，可以在这里指定
          # flutter-version: '3.19.0' 
          channel: 'stable'
          cache: true

      # 4. 获取依赖
      - name: Install dependencies
        run: flutter pub get

      # 5. 编译 APK
      # --debug 编译速度快，--release 体积小但需要签名配置
      # 如果没有配置签名，建议先用 --debug 确认流程能跑通
      - name: Build APK
        run: flutter build apk --debug

      # 6. 上传产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-new-ui-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
